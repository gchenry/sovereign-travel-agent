[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-travel-agent"
version = "0.2.0"
description = "Sovereign Travel & Expense Multi-Agent Fleet with Google Cloud Agent Gateway (Egress Mode)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
cloud = [
    "google-adk>=0.1.0",
    "google-cloud-aiplatform>=1.55.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
